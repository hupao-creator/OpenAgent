name: Liquid DOM feasibility (issue 10)

on:
  push:
    branches: [chatgpt/issue-10-render-probe]

permissions:
  contents: read

jobs:
  probe:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
      - name: Prepare upstream quick start
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/liquid-probe/evidence"
          git archive HEAD -o "$RUNNER_TEMP/liquid-probe/evidence/repository.tar"
          cd "$RUNNER_TEMP/liquid-probe"
          npm init -y
          npm install --save-exact @liquid-dom/react@0.1.1 react@19.2.8 react-dom@19.2.8 electron@43.3.0 esbuild@0.25.12
          cp node_modules/@liquid-dom/react/README.md evidence/react-README.md
          cp node_modules/@liquid-dom/react/package.json evidence/react-package.json
          cp node_modules/@liquid-dom/core/package.json evidence/core-package.json
          tar -czf evidence/liquid-packages.tgz node_modules/@liquid-dom
          cat > index.jsx <<'JS'
          import React from 'react';
          import { createRoot } from 'react-dom/client';
          import { Frame, Glass, GlassContainer, Html, LiquidCanvas } from '@liquid-dom/react';
          window.probeErrors = [];
          window.addEventListener('error', e => window.probeErrors.push(String(e.error || e.message)));
          window.addEventListener('unhandledrejection', e => window.probeErrors.push(String(e.reason)));
          function App() {
            return <LiquidCanvas frameloop="demand" maxDpr={1} style={{width: '900px', height: '560px'}} onError={e => window.probeErrors.push(String(e))}>
              <GlassContainer blur={12} spacing={28}>
                <Frame width={280} height={160}>
                  <Glass cornerRadius={44} pointerEvents>
                    <Html sizing="fill"><button id="native-content" onClick={() => { document.body.dataset.clicked = 'yes'; }} style={{fontSize: 28, color: '#103f28', background: '#a5e5b9', width: '100%', height: '100%'}}>Native content</button></Html>
                  </Glass>
                </Frame>
              </GlassContainer>
            </LiquidCanvas>;
          }
          createRoot(document.getElementById('root')).render(<App/>);
          JS
          cat > index.html <<'HTML'
          <!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;background:#ffffff}button{border:0}</style></head><body><div id="root"></div><script src="bundle.js"></script></body></html>
          HTML
          ./node_modules/.bin/esbuild index.jsx --bundle --outfile=bundle.js --format=iife --define:process.env.NODE_ENV='"development"'
          cat > host.cjs <<'JS'
          const { app, BrowserWindow } = require('electron');
          const { writeFileSync } = require('node:fs');
          const path = require('node:path');
          app.commandLine.appendSwitch('enable-blink-features', 'CanvasDrawElement');
          app.commandLine.appendSwitch('enable-unsafe-webgpu');
          app.commandLine.appendSwitch('use-angle', 'swiftshader');
          const delay = ms => new Promise(r => setTimeout(r, ms));
          const watchdog = setTimeout(() => { console.error('Probe timed out'); app.exit(2); }, 60000);
          app.whenReady().then(async () => {
            const win = new BrowserWindow({show: true, width: 900, height: 600, webPreferences: {backgroundThrottling: false}});
            win.webContents.on('console-message', (_e, details) => console.log('renderer:', details));
            await win.loadFile(path.join(__dirname, 'index.html'));
            await delay(5000);
            const result = await win.webContents.executeJavaScript(`(async () => ({
              ua: navigator.userAgent, secure: isSecureContext, gpu: !!navigator.gpu,
              drawElementImage: typeof CanvasRenderingContext2D.prototype.drawElementImage,
              canvasCount: document.querySelectorAll('canvas').length,
              text: document.querySelector('#native-content')?.textContent,
              errors: window.probeErrors,
              adapter: navigator.gpu ? !!(await navigator.gpu.requestAdapter()) : false,
            }))()`);
            const image = await win.webContents.capturePage();
            writeFileSync(path.join(__dirname, 'evidence/minimal-demo.png'), image.toPNG());
            const data = image.toBitmap();
            let greenPixels = 0;
            for (let i = 0; i < data.length; i += 4) {
              if (data[i+1] > data[i+2] + 15 && data[i+1] > data[i] + 15) greenPixels++;
            }
            result.greenPixels = greenPixels;
            result.versions = process.versions;
            writeFileSync(path.join(__dirname, 'evidence/result.json'), JSON.stringify(result, null, 2));
            console.log(JSON.stringify(result, null, 2));
            clearTimeout(watchdog);
            app.exit(result.errors.length === 0 && greenPixels > 1000 ? 0 : 1);
          }).catch(e => { console.error(e); clearTimeout(watchdog); app.exit(1); });
          JS
      - name: Render in Electron
        shell: bash
        run: |
          cd "$RUNNER_TEMP/liquid-probe"
          ./node_modules/.bin/electron host.cjs
      - name: Preserve probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: liquid-dom-feasibility
          path: ${{ runner.temp }}/liquid-probe/evidence
          if-no-files-found: error
          retention-days: 7
