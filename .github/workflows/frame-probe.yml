name: frame-probe

on: push

permissions:
  contents: read

jobs:
  probe:
    name: Frame production probe
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Probe
        run: node apps/desktop/tests/frame-probe.mjs
      - name: Generate registry
        working-directory: apps/desktop
        run: pnpm generate:registry
      - name: Build the Bart lab
        working-directory: apps/desktop
        run: pnpm exec vite build --config labs/bart/vite.config.ts
      - name: Morph width curve on this runner
        working-directory: apps/desktop
        env:
          BART_MORPH_CURVE: '1'
        run: node tests/bart-generation-visuals.electron.mjs
      - name: Generation visuals with the motion pinned
        working-directory: apps/desktop
        run: node tests/bart-generation-visuals.electron.mjs
      - name: Bart isolation suite with the motion pinned
        working-directory: apps/desktop
        run: pnpm test:bart-isolation
