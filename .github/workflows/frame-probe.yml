name: frame-probe

on: push

permissions:
  contents: read

jobs:
  probe:
    name: Frame production probe
    runs-on: macos-15
    timeout-minutes: 20
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Probe
        run: |
          node apps/desktop/tests/frame-probe.mjs
          FRAME_PROBE_DISABLE_OCCLUSION=1 node apps/desktop/tests/frame-probe.mjs
